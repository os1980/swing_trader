[project]
name = "swing_trader"
version = "0.1.0"
description = "ai-trading-crew using crewAI"
authors = [
    { name = "Yourname", email = "you@example.com" },
]
requires-python = ">=3.12,<3.14"

dependencies = [
    "langchain-ollama>=1.0.1",
    "ta-lib>=0.4.24",
    "pyyaml>=6.0",
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.13.5",
    "chromadb>=1.1.1",
    "crewai==1.8.1",
    "crewai-tools==1.8.1",
    "python-dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "fastapi-sso>=0.16.0",
    "finnhub-python>=2.4.26",
    "langchain>=1.2.3",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-tavily>=0.2.16",
    "pandas>=2.3.3",
    "pydantic>=2.11.10",
    "pygraphviz>=1.14",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "sentence-transformers>=5.2.0",
    "stockstats>=0.6.5",
    "tavily-python>=0.7.17",
    "transformers>=4.46.3",
    "typing-extensions>=4.15.0",
    "yfinance>=1.0",
    "litellm>=0.3.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "pre-commit>=4.0",
]

[tool.uv]
package = true
override-dependencies = [
    # crewai-tools 1.8.1 declares lancedb<0.6, but PyPI deleted every lancedb release below 0.14.
    # Only crewai_tools.adapters.lancedb_adapter imports it, and this project does not use that adapter.
    "lancedb>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
# Only `run` is implemented. train/replay/test used to be registered here and
# pointed at functions that do not exist; don't re-add them without the code.
ai_trading_crew = "src.main:run"
run_crew = "src.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/*.egg-info", "knowledge", "final_reports"]

[tool.ruff.lint]
# Conservative on an existing codebase: correctness and obvious cleanups only.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is formatter territory
    "B008",    # FastAPI/CrewAI style default calls
    "SIM105",  # contextlib.suppress is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# main.py sets environment variables and patches CrewAI tracing before importing
# crewai, so its import order is load-bearing. Don't let the linter sort it.
"src/main.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live database, Ollama, or network; skipped by default",
]
