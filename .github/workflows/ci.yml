name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install check dependencies
        # A full `uv sync` is not used here: ta-lib and pygraphviz need system
        # libraries, and the tests deliberately import neither. Keep this list in
        # step with what tests/ actually imports. The runner's system Python is
        # externally managed, so install into a venv rather than with --system.
        run: |
          uv venv --python 3.12
          uv pip install pytest ruff pyyaml pydantic "psycopg[binary]" pandas numpy stockstats

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Test
        # Offline by design: no Ollama, no database, no network.
        run: .venv/bin/pytest
