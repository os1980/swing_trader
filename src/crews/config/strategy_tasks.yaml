portfolio_analysis_task:
  description: >-
    PROCESS STOCK DOSSIERS AND GENERATE PORTFOLIO JSON
    
    **INPUT 1: MACRO_REPORT**
    {macro_report}
    
    **INPUT 2: STOCK_DOSSIERS**
    {all_symbol_reports}
    
    **TASK SCOPE:**
    Process the stocks provided in INPUT 2 for this specific analysis.
    Each dossier is marked with "TECHNICAL DATA REPORT: [SYMBOL]" header.
    
    **EXECUTION PROTOCOL:**
    
    1. **Parse Input Dossiers:**
       - Count occurrences of "TECHNICAL DATA REPORT:" in INPUT 2
       - Extract the symbol name after each header
       - This gives you the complete list of stocks to process
    
    2. **Assess Market Context:**
       - Read MACRO_REPORT to determine market type and regime
       - Use this as filter for win probability adjustments
    
    3. **Calculate Metrics for Each Stock:**
       - For each symbol extracted in step 1, read its dossier
       - Extract: entry price, stop loss, target, ATR, sentiment, fundamentals
       - Calculate: win_probability, r_ratio, expectancy_value, position_size
    
    4. **Generate Trade Objects:**
       - Create one trade object per symbol extracted in step 1
       - Rank by expectancy if multiple stocks
    
    5. **Output JSON:**
       - trades array must contain exactly the symbols from INPUT 2
       - No additions, no omissions
    
    **KEY PRINCIPLE:**
    Your output is determined by your input parameters for THIS task.
    The stocks in your output = the stocks in INPUT 2.
    
    **OUTPUT CONSTRAINT:**
    - Output one trade object per dossier received in INPUT 2
    - Do NOT fabricate trades for symbols not in INPUT 2
  expected_output: >-
    Return ONLY the raw JSON object described below. No prose before or after it,
    no markdown code fences, no comments. Any extra text breaks downstream parsing.

    JSON object following PortfolioResponse schema.
    
    The "trades" array must contain exactly the stocks found in INPUT 2 (STOCK_DOSSIERS).
    
    **OUTPUT MAPPING:**
    - Count "TECHNICAL DATA REPORT:" headers in INPUT 2
    - Extract symbol from each header
    - Output one trade object per extracted symbol
    - trades array length = number of headers in INPUT 2
    
    **JSON STRUCTURE:**
    {
      "trades": [
        {
          "symbol": "[symbol from INPUT 2 header]",
          "trade_date": "{trade_date}",
          "signal": "BUY or HOLD",
          "market_type": "[from macro report]",
          "trade_setup": {
            "entry_price": [from dossier],
            "stop_loss": [from dossier],
            "profit_target": [from dossier],
            "r_multiple_target": [calculated]
          },
          "expectancy_scorecard": {
            "win_probability": [calculated 0.0-1.0],
            "r_ratio": [calculated],
            "expectancy_value": [calculated]
          },
          "position_sizing": {
            "shares": [calculated],
            "risk_per_trade": {risk},
            "total_account_value": {equity}
          },
          "rationale": {
            "bull_case": "[extract from dossier]",
            "bear_case": "[extract from dossier]"
          }
        }
      ],
      "total_portfolio_risk_percent": [sum of risk per trade]
    }
    
    If INPUT 2 is empty: {"trades": [], "total_portfolio_risk_percent": 0.0}
  agent: portfolio_strategy_manager